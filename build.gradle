plugins {
    id 'application'
}

group = 'com.s3explorer'
version = '0.2.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.55.8')
    implementation('software.amazon.awssdk:s3') {
        // Only the synchronous Apache-based client is used.
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation 'software.amazon.awssdk:apache5-client'
    // Enable SSO, IAM Identity Center and role-assumption profiles in ~/.aws/config.
    runtimeOnly 'software.amazon.awssdk:sso'
    runtimeOnly 'software.amazon.awssdk:ssooidc'
    runtimeOnly 'software.amazon.awssdk:sts'

    implementation 'com.formdev:flatlaf:3.7.2'
    implementation 'com.formdev:flatlaf-extras:3.7.2'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.3'

    implementation 'ch.qos.logback:logback-classic:1.6.4'
    implementation 'org.commonmark:commonmark:0.30.0'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

application {
    mainClass = 'com.s3explorer.app.Application'
    applicationName = 's3explorer'
}

tasks.named('test') {
    useJUnitPlatform()
    // Integration tests run only when an S3-compatible endpoint is supplied, e.g.
    // S3E_IT_ENDPOINT=http://localhost:9000 S3E_IT_ACCESS_KEY=... S3E_IT_SECRET_KEY=...
    ['S3E_IT_ENDPOINT', 'S3E_IT_ACCESS_KEY', 'S3E_IT_SECRET_KEY', 'S3E_IT_REGION'].each { name ->
        def value = System.getenv(name)
        if (value) environment name, value
    }
    systemProperty 's3explorer.home', layout.buildDirectory.dir('test-home').get().asFile.absolutePath
    testLogging {
        events = ['failed', 'skipped']
        exceptionFormat = 'full'
    }
}
